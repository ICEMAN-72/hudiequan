name: Supabase Keep Alive

# Supabase 免费版连续 7 天没有活动会自动暂停项目，暂停后 90 天不恢复就会永久删除。
# 这个工作流每 3 天访问一次 REST 接口，制造活动，避免项目被暂停。
#
# 前提：在仓库 Settings → Secrets and variables → Actions 里添加两个 Secret：
#   SUPABASE_URL      例如 https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY 项目 Settings → API 里的 anon public key
#
# 注意：GitHub 会在仓库 60 天无提交后自动停用定时工作流，
#       如果收到 "workflow disabled" 邮件，去 Actions 页点一下 Enable 即可。

on:
  schedule:
    # 每 3 天 03:17 UTC 跑一次（避开整点，减少排队延迟）
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::未配置 SUPABASE_URL / SUPABASE_ANON_KEY，跳过保活"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Supabase REST API
        if: steps.check.outputs.ready == 'true'
        run: |
          BASE="${{ secrets.SUPABASE_URL }}"
          BASE="${BASE%/}"
          # 任何一次 HTTP 请求都会算作项目活动，200/401 都说明服务活着
          CODE=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 20 \
            "$BASE/rest/v1/" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $CODE"
          head -c 200 /tmp/body.txt || true
          echo ""
          if [ "$CODE" = "000" ]; then
            echo "::error::连不上 $BASE —— 项目可能已被暂停或删除，请到 supabase.com 检查"
            exit 1
          fi
          if [ "$CODE" -ge 500 ]; then
            echo "::error::服务返回 $CODE，项目可能处于暂停状态"
            exit 1
          fi
          echo "✅ 保活成功（$CODE）"

      - name: Verify tasks table
        if: steps.check.outputs.ready == 'true'
        run: |
          BASE="${{ secrets.SUPABASE_URL }}"
          BASE="${BASE%/}"
          CODE=$(curl -s -o /tmp/t.txt -w '%{http_code}' --max-time 20 \
            "$BASE/rest/v1/tasks?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "tasks 表探测 HTTP $CODE"
          # anon 角色受 RLS 限制，返回 [] 或 401/403 都是正常现象，
          # 只有 404 说明表没建。
          if [ "$CODE" = "404" ]; then
            echo "::warning::tasks 表不存在，请到 SQL Editor 执行 supabase/schema.sql"
          fi
